name: portfolio-dev

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: portfolio-postgres-dev
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    volumes:
      - portfolio-postgres-data:/var/lib/postgresql/data

volumes:
  portfolio-postgres-data:
